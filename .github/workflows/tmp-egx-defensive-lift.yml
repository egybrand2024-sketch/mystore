name: Frozen EGX Defensive Lift v5.17 Shadow Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * 0-4'
  push:
    branches:
      - tmp-egx-defensive-lift-v517-oos-20260904
    paths:
      - '.github/workflows/tmp-egx-defensive-lift.yml'
      - 'tmp/egx_backtest/live_v517_shadow_scanner.py'
      - 'tmp/egx_backtest/live_v517_execution_audit.py'
      - 'tmp/egx_backtest/audit_v517_week_20260823_27.py'

permissions:
  contents: write

concurrency:
  group: frozen-v517-shadow-scanner
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-egx-defensive-lift-v517-oos-20260904
          fetch-depth: 1
      - run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scikit-learn pandas yfinance
      - run: |
          rm -rf egxdata
          git clone --depth 1 https://github.com/mohamedredasafan1/dataroom.git egxdata
      - run: python3 tmp/egx_backtest/live_v517_shadow_scanner.py
      - name: Archive scan by market date
        run: |
          SCAN_DATE=$(python3 -c "import json; print(json.load(open('tmp/egx_backtest/live_v517_shadow_scan.json'))['scan_date'])")
          mkdir -p tmp/egx_backtest/live_v517_shadow_history
          cp tmp/egx_backtest/live_v517_shadow_scan.json "tmp/egx_backtest/live_v517_shadow_history/scan_${SCAN_DATE}.json"
      - name: Measure next-session execution gap
        run: python3 tmp/egx_backtest/live_v517_execution_audit.py
      - name: Audit prior week opportunities
        run: python3 tmp/egx_backtest/audit_v517_week_20260823_27.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/egx_backtest/live_v517_shadow_scan.json tmp/egx_backtest/live_v517_shadow_history/ tmp/egx_backtest/live_v517_execution_audit.json tmp/egx_backtest/audit_v517_week_20260823_27.json
          if git diff --cached --quiet; then
            echo "No scan changes"
          else
            git commit -m "Frozen v5.17 shadow scan and prior-week audit"
            git push origin HEAD:tmp-egx-defensive-lift-v517-oos-20260904
          fi
