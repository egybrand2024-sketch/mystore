name: Temporary EGX Defensive Lift Backtest

on:
  push:
    branches:
      - tmp-egx-defensive-lift-20260904
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp-egx-defensive-lift-20260904
          fetch-depth: 1

      - name: Install research dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scikit-learn

      - name: Fetch public EGX historical dataset
        run: |
          rm -rf egxdata
          git clone --depth 1 https://github.com/mohamedredasafan1/dataroom.git egxdata
          echo "CSV files: $(find egxdata/Dataset/raw -name '*.csv' | wc -l)"

      - name: Run EGX v4.1 quality gate research
        run: python3 tmp/egx_backtest/backtest_v41_quality_gate.py

      - name: Commit v4.1 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin tmp-egx-defensive-lift-20260904
          git add tmp/egx_backtest/results_v41_quality_gate.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "EGX v4.1 quality gate research result"
            git push origin HEAD:tmp-egx-defensive-lift-20260904
          fi
