name: Temporary EGX Defensive Lift Backtest

on:
  push:
    branches:
      - tmp-egx-defensive-lift-20260904
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp-egx-defensive-lift-20260904
          fetch-depth: 1

      - name: Install research dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scikit-learn

      - name: Fetch public EGX historical dataset
        run: |
          rm -rf egxdata
          git clone --depth 1 https://github.com/mohamedredasafan1/dataroom.git egxdata
          echo "CSV files: $(find egxdata/Dataset/raw -name '*.csv' | wc -l)"

      - name: Run Defensive Lift v1 backtest
        run: python3 tmp/egx_backtest/backtest.py

      - name: Run Defensive Lift v2 research backtest
        run: python3 tmp/egx_backtest/backtest_v2.py

      - name: Run robust Defensive Lift v2 research
        run: python3 tmp/egx_backtest/backtest_v2_robust.py

      - name: Run expanded Defensive Lift v3 ML research
        run: python3 tmp/egx_backtest/backtest_v3_ml.py

      - name: Run expanded Defensive Lift v3 rule research
        run: python3 tmp/egx_backtest/backtest_v3_rules.py

      - name: Commit results to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/egx_backtest/results.json tmp/egx_backtest/results_v2.json tmp/egx_backtest/results_v2_robust.json tmp/egx_backtest/results_v3_ml.json tmp/egx_backtest/results_v3_rules.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "EGX Defensive Lift v1/v2/v3 expanded research results"
            git push origin HEAD:tmp-egx-defensive-lift-20260904
          fi
