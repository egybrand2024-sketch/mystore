name: Frozen EGX Defensive Lift v5.17 OOS Test

on:
  push:
    branches:
      - tmp-egx-defensive-lift-v517-oos-20260904
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-egx-defensive-lift-v517-oos-20260904
          fetch-depth: 1
      - run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy scikit-learn pandas yfinance
      - run: |
          rm -rf egxdata
          git clone --depth 1 https://github.com/mohamedredasafan1/dataroom.git egxdata
      - run: python3 tmp/egx_backtest/test_v517_frozen_oos_fresh.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin tmp-egx-defensive-lift-v517-oos-20260904
          git add tmp/egx_backtest/results_v517_frozen_oos_fresh.json
          if git diff --cached --quiet; then echo "No result changes"; else git commit -m "Frozen v5.17 fresh OOS result" && git push origin HEAD:tmp-egx-defensive-lift-v517-oos-20260904; fi
